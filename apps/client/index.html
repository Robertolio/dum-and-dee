<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#123f45" />
    <title>Dum &amp; Dee</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100dvh;
        background: #0d2b30;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #fff;
      }
      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        touch-action: none;
        outline: none;
      }
      #rotate {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: #0d2b30;
        z-index: 20;
        font-size: 20px;
        padding: 24px;
      }
      @media (orientation: portrait) and (max-width: 900px) {
        #rotate {
          display: flex;
        }
      }
      #debug-toggle {
        position: fixed;
        right: max(8px, env(safe-area-inset-right));
        bottom: max(8px, env(safe-area-inset-bottom));
        z-index: 30;
        width: 34px;
        height: 34px;
        border-radius: 17px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        background: rgba(0, 0, 0, 0.45);
        color: #fff;
        font-size: 16px;
        line-height: 32px;
        text-align: center;
        cursor: pointer;
        padding: 0;
      }
      #debug {
        position: fixed;
        right: max(8px, env(safe-area-inset-right));
        bottom: 48px;
        z-index: 30;
        width: 250px;
        max-height: calc(100dvh - 60px);
        overflow-y: auto;
        background: rgba(10, 20, 24, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 12px;
        display: none;
        touch-action: pan-y;
      }
      #debug.open {
        display: block;
      }
      #debug h3 {
        margin: 0 0 6px;
        font-size: 13px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #9fd9df;
      }
      #debug .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 4px 0;
      }
      #debug label {
        flex: 1;
        white-space: nowrap;
      }
      #debug input[type='range'] {
        flex: 1.4;
        min-width: 80px;
      }
      #debug .val {
        width: 44px;
        text-align: right;
        font-variant-numeric: tabular-nums;
        color: #ffd36b;
      }
      #debug button,
      #debug select {
        background: #1d4d55;
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 6px;
        padding: 4px 8px;
        font-size: 12px;
        cursor: pointer;
      }
      #debug button.active {
        background: #e0a92a;
        color: #1b1b1b;
        font-weight: 600;
      }
      #debug .readout {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        white-space: pre;
        color: #cfe9ec;
        margin-top: 6px;
      }
      #debug hr {
        border: 0;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        margin: 8px 0;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">Rotate your phone to landscape to play Dum &amp; Dee.</div>
    <button id="debug-toggle" type="button" aria-label="Debug panel" title="Debug panel">&#9881;</button>
    <div id="debug" aria-label="Debug panel"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
