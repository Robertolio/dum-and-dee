<svg xmlns="http://www.w3.org/2000/svg" width="512" height="400" viewBox="0 0 512 400">
  <rect width="512" height="400" fill="#1f6b74"/>
  <rect x="0" y="0" width="512" height="400" fill="url(#g)" opacity="0.35"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f3f46"/>
      <stop offset="1" stop-color="#2a7f89"/>
    </linearGradient>
  </defs>
  <!-- wall panel seams -->
  <g stroke="#17525a" stroke-width="3" fill="none">
    <line x1="0" y1="90" x2="512" y2="90"/>
    <line x1="0" y1="250" x2="512" y2="250"/>
    <line x1="128" y1="0" x2="128" y2="400"/>
    <line x1="384" y1="0" x2="384" y2="400"/>
  </g>
  <!-- mustard panel -->
  <rect x="160" y="110" width="190" height="120" rx="6" fill="#c9a12b" stroke="#8d6f18" stroke-width="4"/>
  <rect x="176" y="126" width="158" height="88" rx="4" fill="none" stroke="#8d6f18" stroke-width="2" opacity="0.6"/>
  <!-- grey control box -->
  <rect x="40" y="200" width="60" height="110" rx="5" fill="#8fa3a6" stroke="#4e6366" stroke-width="4"/>
  <circle cx="70" cy="228" r="9" fill="#dfe9ea" stroke="#4e6366" stroke-width="3"/>
  <rect x="54" y="250" width="32" height="14" rx="2" fill="#2d3a3c"/>
  <rect x="54" y="272" width="32" height="8" rx="2" fill="#e0b22e"/>
  <!-- rivets -->
  <g fill="#17525a">
    <circle cx="12" cy="12" r="4"/><circle cx="500" cy="12" r="4"/>
    <circle cx="12" cy="388" r="4"/><circle cx="500" cy="388" r="4"/>
    <circle cx="256" cy="12" r="4"/><circle cx="256" cy="388" r="4"/>
  </g>
  <!-- small sign -->
  <rect x="420" y="130" width="60" height="40" rx="4" fill="#8fa3a6" stroke="#4e6366" stroke-width="3"/>
  <rect x="430" y="140" width="40" height="6" fill="#4e6366"/><rect x="430" y="152" width="26" height="6" fill="#4e6366"/>
</svg>
