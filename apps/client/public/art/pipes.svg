<svg xmlns="http://www.w3.org/2000/svg" width="512" height="400" viewBox="0 0 512 400">
  <!-- purple pipe run along the top -->
  <rect x="0" y="40" width="512" height="18" rx="9" fill="#5b4d82" stroke="#3a2f58" stroke-width="3"/>
  <rect x="80" y="34" width="22" height="30" rx="4" fill="#746497" stroke="#3a2f58" stroke-width="3"/>
  <rect x="330" y="34" width="22" height="30" rx="4" fill="#746497" stroke="#3a2f58" stroke-width="3"/>
  <!-- vertical pipe with valve -->
  <rect x="440" y="40" width="18" height="300" rx="9" fill="#5b4d82" stroke="#3a2f58" stroke-width="3"/>
  <circle cx="449" cy="220" r="22" fill="none" stroke="#3a2f58" stroke-width="6"/>
  <circle cx="449" cy="220" r="22" fill="none" stroke="#e0b22e" stroke-width="3"/>
  <rect x="400" y="330" width="60" height="18" rx="9" fill="#5b4d82" stroke="#3a2f58" stroke-width="3"/>
  <!-- grey conduit -->
  <rect x="0" y="300" width="300" height="10" rx="5" fill="#7d8a90" stroke="#4e5a5e" stroke-width="2"/>
  <rect x="290" y="300" width="10" height="60" rx="5" fill="#7d8a90" stroke="#4e5a5e" stroke-width="2"/>
</svg>
